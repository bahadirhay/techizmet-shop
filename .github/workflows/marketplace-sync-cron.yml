name: Marketplace sync cron

on:
  schedule:
    # GitHub ~15 dk; endpoint içindeki aralık ayarları (orderPullMinutes vb.) gerçek sıklığı belirler
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  # CRON_SECRET_ANATOLIANPAW = Vercel Production CRON_SECRET
  anatolianpaw:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — secret tanımlı mı?
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET_ANATOLIANPAW }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET_ANATOLIANPAW GitHub secret'i tanımlı değil."
            exit 1
          fi

      - name: Sipariş + stok + Trendyol QnA
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET_ANATOLIANPAW }}
          SITE_ORIGIN: https://www.anatolianpaw.com
        run: |
          set -euo pipefail

          # GitHub runner'larda ara sıra DNS (curl exit 6) / kısa ağ kesintisi olur.
          curl_with_retry() {
            local out="$1"
            local http_file="$2"
            shift 2
            local attempt=1
            local max=6
            local delay=5
            local curl_exit=0
            : >"$http_file"
            while [ "$attempt" -le "$max" ]; do
              curl_exit=0
              curl -sS --connect-timeout 20 --max-time 120 \
                --retry 2 --retry-delay 3 --retry-all-errors \
                -o "$out" -w "%{http_code}" "$@" >"$http_file" || curl_exit=$?
              if [ "$curl_exit" -eq 0 ]; then
                return 0
              fi
              echo "::warning::curl deneme ${attempt}/${max} başarısız (exit ${curl_exit}); ${delay}s sonra tekrar…"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
              if [ "$delay" -gt 60 ]; then delay=60; fi
            done
            echo "::error::curl ${max} denemeden sonra başarısız (son exit ${curl_exit}). DNS/ağ sorunu olabilir."
            return "$curl_exit"
          }

          call_cron() {
            local name="$1"
            local path="$2"
            local url="${SITE_ORIGIN}${path}"
            local body="/tmp/cron-${name}.txt"
            local http_file="/tmp/cron-${name}.http"
            curl_with_retry "$body" "$http_file" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Accept: application/json" \
              "$url"
            local code
            code=$(cat "$http_file")
            echo "${name} HTTP ${code}"
            head -c 2000 "$body"; echo
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::${name} cron başarısız (HTTP ${code})"
              exit 22
            fi
            # Next soft-404 HTML bazen 200 döner — JSON zorunlu
            if ! grep -q '"ok"' "$body"; then
              echo "::error::${name} JSON yanıt değil (muhtemel 404/HTML). Deploy tamamlanmamış olabilir."
              exit 22
            fi
          }

          call_cron orders "/api/cron/marketplace/orders"
          call_cron inventory "/api/cron/marketplace/inventory"
          call_cron qna "/api/cron/marketplace/trendyol-qna"
